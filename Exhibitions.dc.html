<style>

<div ref="{{setRoot}}" style="width: 390px; height: 844px; background: #E8E7D5; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box">
<main class="{{scrollClass}}" onScroll="{{onScroll}}" style="flex: 1; min-height: 0; overflow-y: auto; padding: 56px 16px 108px 16px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1">On view</h1>
<div style="position: sticky; top: 0; z-index: 5; padding: 12px 0; display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Filter exhibitions" style="display: flex; gap: 8px; flex-wrap: nowrap">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<sc-if value="{{showShort}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{toggleShort}}" aria-pressed="{{short}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 14px; padding: 12px 14px; min-height: 60px; font: inherit; color: #1A1A1F; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Short on time?</span><span style="font-size: 14px; color: #5A5852">Show 20-minute highlight routes</span></span>
<span style="{{switchTrack}}"><span style="{{switchKnob}}"></span></span>
</button>
</sc-if>
</div>
<div class="stagger" style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" class="xcard" style="{{it.cardStyle}}">
<div style="{{it.art}}"><sc-if value="{{it.hasImg}}" hint-placeholder-val="{{ false }}"><img src="70a38660bc221fb69de2c62284241782.jpg" alt="Sandro Botticelli, The Birth of Venus" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 48% 40%; display: block"></sc-if><sc-if value="{{it.hasEgypt}}" hint-placeholder-val="{{ false }}"><img src="c63c2a163de729b06335b37000508338.jpg" alt="Ancient Egyptian painted wall scene of an offering to Osiris" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 30% 40%; display: block"></sc-if><sc-if value="{{it.hasInk}}" hint-placeholder-val="{{ false }}"><img src="1330d3a2bc75b8ea11c1bc3bb652ef0f.jpg" alt="Misty Landscape with Scholars and Attendants, Chinese fan painting on silk" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 80% 65%; display: block"></sc-if><sc-if value="{{it.hasPacific}}" hint-placeholder-val="{{ false }}"><img src="3ef6f04a8dfd73c5f422635f58cf8a13.jpg" alt="Tall sea stacks rising from rough water below coastal cliffs" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 40% 50%; display: block"></sc-if><sc-if value="{{it.hasBauhaus}}" hint-placeholder-val="{{ false }}"><img src="4b2b6867da23a06ef9cf452bd146f337.jpg" alt="Abstract watercolor of overlapping arcs and bands in red, orange, green and black" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 50% 45%; display: block"></sc-if><sc-if value="{{it.hasYoung}}" hint-placeholder-val="{{ false }}"><img src="814b336789cd1b346595a3f1bf702bf1.jpg" alt="Children drawing and painting together on large sheets of paper" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 45% 70%; display: block"></sc-if><sc-if value="{{it.hasThreads}}" hint-placeholder-val="{{ false }}"><img src="896073b86b2e1ac1cf7df188ccf3794a.jpg" alt="Close-up of white warp threads stretched across a weaving loom" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 22% 65%; display: block"></sc-if><sc-if value="{{it.hasFamily}}" hint-placeholder-val="{{ false }}"><img src="a47337cb7a29ad15fa73f3ee19cafa97.jpg" alt="Paint palettes covered in colorful paint beside brushes and paint bottles" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 50% 45%; display: block"></sc-if><sc-if value="{{it.hasKondo}}" hint-placeholder-val="{{ false }}"><img src="6720d2c63ec68d878a6d5706819b0144.jpg" alt="Five smoke-fired ceramic heads with upturned faces" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; object-position: 30% 50%; display: block"></sc-if><sc-if value="{{it.hasMono}}" hint-placeholder-val="{{ false }}"><img src="2a17403471e3109b5ea5ef17f5f5f609.jpg" alt="Detail of a sculpture made of clustered translucent discs in grey and silver" style="width: 100%; height: 170px; border-radius: 14px; object-fit: cover; display: block"></sc-if></div>
<div style="display: flex; flex-direction: column; gap: 5px; padding: 2px 4px 0; min-width: 0">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8A3A26">{{it.kind}}</span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; line-height: 1.1">{{it.title}}</span>
<span style="font-size: 14px; line-height: 1.35; color: #33312C">{{it.desc}}</span>
<span style="font-size: 14px; color: #5A5852"><span style="font-weight: 700; color: #1A1A1F">{{it.date}}</span>{{it.rest}}</span>
<sc-if value="{{it.hasTicket}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; color: #5A5852">Ticket required</span></sc-if>
<span style="font-size: 14px; font-weight: 700; color: #2C3E9E">{{it.time}}</span>
</div>
</a>
</sc-for>
<div aria-hidden="true" style="{{stackSpacer}}"></div>
</div>
<sc-if value="{{showShort}}" hint-placeholder-val="{{ true }}">
<a class="btn2" href="PastExhibitions.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 18px; border-radius: 28px; border: 1.5px solid #1A1A1F; color: #1A1A1F; font-size: 16px; font-weight: 700; text-decoration: none">Past exhibitions<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg></a>
</sc-if>
</main>

<a class="navi" href="Exhibitions.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #2C3E9E; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="currentColor" stroke="currentColor"></rect><path d="M4 16l5-5 4 4 3-3 4 4" stroke="#FFFFFF"></path></svg><span style="display: flex; flex-direction: column; align-items: stretch; gap: 3px">On view<span aria-hidden="true" style="height: 4px; border-radius: 2px; background: #F9C818"></span></span></a>

<a class="navi" href="Tickets.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #33312C; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path></svg><span style="display: flex; flex-direction: column; align-items: stretch; gap: 3px">Tickets<span aria-hidden="true" style="height: 4px; border-radius: 2px; background: transparent"></span></span></a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
_topReset() { const r = this._root; if (!r) return; [r, ...r.querySelectorAll('*')].forEach(e => { if (e.scrollTop) e.scrollTop = 0; }); }
_bootTop() { this._topReset(); this._tt1 = setTimeout(() => this._topReset(), 60); this._tt2 = setTimeout(() => this._topReset(), 350); }
componentDidMount() { this._bootTop(); }

constructor(p) { super(p); this.state = { filter: 'now', short: false, scrolling: false }; }
renderVals() {
const f = this.state.filter, short = this.state.short;
const chipBase = 'min-height: 44px; padding: 0 14px; white-space: nowrap; border-radius: 22px; font: inherit; font-size: 15px; cursor: pointer; ';
const chips = [['now','Now on view'],['soon','Coming soon'],['free','Free']].map(([id,label]) => ({
label, on: f === id ? 'true' : 'false',
style: chipBase + (f === id ? 'background: #1A1A1F; color: #FFFFFF; border: 1px solid #1A1A1F; font-weight: 700' : 'background: #FFFFFF; color: #1A1A1F; border: 1px solid #CFCAC0'),
pick: () => this.setState({ filter: id })
}));
const art = (bg) => 'width: 100%; height: 170px; border-radius: 14px; overflow: hidden; background: ' + bg;
const nowList = [
{ kind: 'Special exhibition', desc: 'Myths reborn in 15th-century Florence. See how Botticelli and his peers reimagined beauty.', title: 'Born of the Sea: Botticelli and the Florentine Renaissance', meta: 'Oct 1 – Dec 20 · Level 2 · Ticket required', full: 'About 60 min', hl: '20-min highlights: 6 works', art: art('#2E3D6B'), hasImg: true, href: 'Exhibition.dc.html' },
{ kind: 'Special exhibition', desc: 'Painted tombs and the gods of the afterlife. Follow the journey Egyptians believed every soul would take.', title: 'Journey Beyond the Nile: Egypt and the Afterlife', meta: 'Sep 5 – Jan 10 · Level 3 · Ticket required', full: 'About 30 min', hl: '20-min highlights: 4 works', art: art('#E8C9BE'), hasEgypt: true, href: 'ExhibitionNile.dc.html' },
{ kind: 'Special exhibition', desc: 'Black, white and silver, from mobiles to vast fields. Two artists, one restrained palette.', title: 'Monochrome: Calder and Tara Donovan', meta: 'May 13, 2026 – Jan 17, 2027 · Level 2 · Ticket required', full: 'About 45 min', hl: '20-min highlights: 5 works', art: art('#3A3D45'), hasMono: true, href: 'ExhibitionMono.dc.html' },
{ kind: 'Special exhibition', desc: 'Generations of storytelling in clay. Faces and vessels marked by fire and smoke.', title: 'The Kondo Family: Storytellers in Clay', meta: 'Aug 22, 2026 – Feb 28, 2027 · Level 3 · Ticket required', full: 'About 30 min', hl: '20-min highlights: 4 works', art: art('#6B625A'), hasKondo: true, href: 'ExhibitionKondo.dc.html' }
];
const soon = [
{ kind: 'Coming soon', desc: 'Mist, mountains and scholars painted on silk. Ink landscapes that became a way of thinking.', title: 'Ink and Mountain: Landscapes of Song Dynasty China', meta: 'Feb 12 – Jun 6, 2027 · Level 3 · Ticket required', time: 'Opens Feb 12 · Notify me', art: art('#7E8B6A'), hasInk: true, href: 'ExhibitionInk.dc.html' },
{ kind: 'Coming soon', desc: 'Sea stacks, fog and long northern light. Photographs of the coastline that shapes life here.', title: 'Pacific Light: Photographs of the Northwest Coast', meta: 'Mar 4 – Aug 15, 2027 · Level 2 · Ticket required', time: 'Opens Mar 4 · Notify me', art: art('#5B7A8C'), hasPacific: true, href: 'ExhibitionPacific.dc.html' },
{ kind: 'Coming soon', desc: 'How one design school shaped everyday objects. From teapots to textiles we still live with.', title: 'Bauhaus at Home: Design for Everyday Life', meta: 'Apr 22 – Sep 19, 2027 · Level 4 · Ticket required', time: 'Opens Apr 22 · Notify me', art: art('#C9503A'), hasBauhaus: true, href: 'ExhibitionBauhaus.dc.html' }
];
const free = [
{ kind: 'Free', desc: 'Student art, refreshed every season. Paintings, drawings and sculpture by Seattle students.', title: 'Young Artists of Seattle: Community Gallery', meta: 'Ongoing · Level 1', time: 'Free · No ticket needed', art: art('#E0B43A'), hasYoung: true, href: 'ExhibitionYoung.dc.html' },
{ kind: 'Free', desc: 'A lobby weaving that traces Puget Sound. Look up from the escalators for the full view.', title: 'Threads of the Sound: Lobby Installation', meta: 'Through Mar 2027 · Level 1', time: 'Free · No ticket needed', art: art('#4F6B8A'), hasThreads: true, href: 'ExhibitionThreads.dc.html' },
{ kind: 'Free', desc: 'Drop-in art making for every age. Materials and teaching artists are ready, no experience needed.', title: 'Family Art Studio', meta: 'Weekends, 11 am – 3 pm · Level 1', time: 'Free drop-in for all ages', art: art('#D98E73'), hasFamily: true, href: 'ExhibitionFamily.dc.html' }
];
const items0 = f === 'soon' ? soon : f === 'free' ? free : nowList.map(i => ({ ...i, time: short ? i.hl : i.full }));
const items = items0.map(i => { const parts = i.meta.split(' · '); const hasTicket = parts.includes('Ticket required'); const rest = parts.slice(1).filter(x => x !== 'Ticket required'); return { ...i, date: parts[0], rest: rest.length ? ' · ' + rest.join(' · ') : '', hasTicket }; }).map((i, k) => ({ ...i, cardStyle: 'position: sticky; top: ' + ((f === 'now' ? 150 : 80) + k * 14) + 'px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #1A1A1F; background: #F6F5EC; border: 1px solid rgba(255,255,255,0.9); border-radius: 22px; padding: 10px 10px 16px; box-shadow: 0 -12px 24px -4px rgba(60,45,20,0.20), 0 -2px 6px rgba(60,45,20,0.08), 0 2px 6px rgba(60,45,20,0.06)' }));
return {
stackSpacer: 'flex: 0 0 auto; height: ' + (f === 'now' ? 240 : 300) + 'px; animation: none',
setRoot: (el) => { this._root = el; },
navWrap: 'position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; ' + (this.state.navHidden ? 'transform: translateY(110%); opacity: 0; transition: transform .28s cubic-bezier(.4,0,1,1), opacity .22s ease-in; pointer-events: none' : 'transform: translateY(0); opacity: 1; transition: transform .5s cubic-bezier(.34,1.45,.64,1), opacity .25s ease-out'),

chips, items, short: short ? 'true' : 'false', showShort: f === 'now',
scrollClass: 'intro nobar',
onScroll: () => { 
if (!this.state.scrolling) this.setState({ scrolling: true });
clearTimeout(this._hideTimer);
this._hideTimer = setTimeout(() => this.setState({ scrolling: false }), 900);
},
toggleShort: () => this.setState({ short: !short }),
switchTrack: 'flex: 0 0 auto; width: 50px; height: 30px; border-radius: 15px; position: relative; background: ' + (short ? '#F9C818; box-shadow: inset 0 0 0 1.5px #B98A00' : '#B9B4AA'),
switchKnob: 'position: absolute; top: 3px; width: 24px; height: 24px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.25); background: ' + '#FFFFFF' + '; left: ' + (short ? '23px' : '3px')
};
}
}
</script>
